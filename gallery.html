<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천살 추억갤러리</title><link rel="stylesheet" href="style.css"><style>body{background:#100d0f;color:#f5e7d5}.gallery-hero{text-align:center;padding:65px 10px;background:radial-gradient(ellipse at top,#67372c,#100d0f 75%);border-bottom:1px solid #664536}.gallery-hero h1{font-size:clamp(32px,6vw,56px);color:#f1c18a;margin:12px 0}.gallery-filters{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.gallery-filters button{background:#24181a;color:#d8c1ad;border:1px solid #644737}.gallery-filters button.active{background:#b57a4c;color:#130c0c}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.gallery-card{background:#201719;border:1px solid #674535;border-radius:8px;overflow:hidden}.gallery-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}.gallery-caption{padding:14px 16px}.gallery-caption strong{display:block;color:#f0c48b}.gallery-caption small{color:#ad9b91}.gallery-empty{grid-column:1/-1;text-align:center;padding:65px 20px;border:1px dashed #785641;color:#c4ae9d}.gallery-admin{margin:40px 0 0;padding:20px;background:#1e1517;border:1px solid #51362c;border-radius:9px}.gallery-admin summary{cursor:pointer;color:#e9c28d;font-weight:bold}.gallery-admin form{margin-top:16px}.gallery-admin input,.gallery-admin select,.gallery-admin button{max-width:100%}.gallery-admin input[type=file]{width:100%}.gallery-admin label{display:block;color:#e3c6a7;font-size:13px;margin:10px 0 5px}.gallery-admin .rowform{display:flex;gap:10px;flex-wrap:wrap}.gallery-admin .rowform input{flex:1}.gallery-admin button{background:#a36d46;color:white}.gallery-admin button:disabled{opacity:.45}.gallery-note{color:#aa988e;font-size:13px}.gallery-preview{width:100%;max-width:400px;max-height:230px;object-fit:contain;display:none;margin:10px 0}.gallery-dialog{border:1px solid #b18a62;background:#130d0f;color:white;max-width:min(94vw,1100px);padding:10px}.gallery-dialog img{max-width:100%;max-height:80vh;display:block}.gallery-dialog button{float:right}.gallery-card button{margin:0 14px 14px;font-size:12px}.gallery-card button[hidden]{display:none}@media(max-width:800px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.gallery-grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap head"><a class="logo" href="index.html">天殺 CHEONSAL</a><nav><a href="index.html">홈</a><a href="hot.html">천살일보</a><a href="board.html">자유게시판</a><a href="members.html">길드원</a><a class="active" href="gallery.html">추억갤러리</a></nav></div></header><main><div class="gallery-hero"><div class="eyebrow">CHEONSAL MEMORIES</div><h1>📸 천살 추억갤러리</h1><p>함께했던 순간들이 모여 천살의 역사가 됩니다.</p></div><section class="section"><div class="wrap"><div class="gallery-filters" id="galleryFilters"><button class="active" data-category="전체">전체</button><button data-category="단체사진">단체사진</button><button data-category="레이드·보스">레이드·보스</button><button data-category="점령전·제전">점령전·제전</button><button data-category="득템 인증">득템 인증</button><button data-category="웃긴 순간">웃긴 순간</button><button data-category="기타">기타</button></div><p class="gallery-note" id="galleryStatus">사진 목록을 불러오는 중…</p><div class="gallery-grid" id="galleryGrid"><div class="gallery-empty">천살의 첫 추억을 기다리는 중입니다.</div></div><details class="gallery-admin"><summary>🔐 갤러리 관리자</summary><p class="gallery-note">관리자 계정으로 로그인한 경우에만 사진 등록 및 삭제가 가능합니다. 일반 방문자는 사진만 볼 수 있습니다.</p><div id="adminLoggedOut"><form id="galleryLogin"><div class="rowform"><input id="galleryEmail" type="email" placeholder="관리자 이메일" required autocomplete="username"><input id="galleryPassword" type="password" placeholder="비밀번호" required autocomplete="current-password"><button type="submit">관리자 로그인</button></div></form></div><div id="adminLoggedIn" hidden><p>관리자 로그인 상태 <button id="galleryLogout" type="button">로그아웃</button></p><form id="galleryUpload"><label for="galleryFile">사진 선택 (JPG / PNG / WEBP, 10MB 이하)</label><input type="file" id="galleryFile" accept="image/jpeg,image/png,image/webp" required><img id="galleryPreview" class="gallery-preview" alt="사진 미리보기"><label for="galleryTitle">사진 제목</label><input id="galleryTitle" maxlength="80" required placeholder="예: 첫 길드레이드 단체사진"><label for="galleryCategory">카테고리</label><select id="galleryCategory"><option>단체사진</option><option>레이드·보스</option><option>점령전·제전</option><option>득템 인증</option><option>웃긴 순간</option><option>기타</option></select><label for="galleryDescription">사진 설명 (선택)</label><input id="galleryDescription" maxlength="300" placeholder="그날의 추억을 남겨주세요"><p><button type="submit" id="galleryUploadButton">사진 등록</button></p></form></div><p id="galleryAdminStatus" class="gallery-note"></p></details><p class="gallery-note">사진은 운영자가 직접 등록합니다. 길드원은 별도 로그인 없이 열람할 수 있습니다.</p></div></section></main><dialog id="galleryDialog" class="gallery-dialog"><button type="button" id="galleryDialogClose">닫기 ✕</button><img id="galleryLarge" alt="확대 사진"></dialog><footer><div class="wrap">CHEONSAL · © 2026 CHEONSAL GUILD</div></footer><script type="module" src="gallery.js?v=20261009a"></script></body></html>
